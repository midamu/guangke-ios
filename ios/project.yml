# XcodeGen 工程定义：不用手写 project.pbxproj，CI 里 `xcodegen generate` 即可。
# 产物：ios/iosApp/GuangXiaoKe.xcodeproj
name: GuangXiaoKe

options:
  bundleIdPrefix: com.jianke.schedule
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

targets:
  GuangXiaoKe:
    type: application
    platform: iOS
    sources:
      - path: iosApp
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jianke.schedule.ios
        INFOPLIST_FILE: iosApp/Info.plist
        # Compose 产物由 gradle 的 linkReleaseFrameworkIosArm64 生成在这个目录
        FRAMEWORK_SEARCH_PATHS:
          - "$(SRCROOT)/../composeApp/build/bin/iosArm64/releaseFramework"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        # 未签名构建：签名由使用者自己完成
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    dependencies:
      # isStatic = true：静态框架，直接链进可执行文件，**不能 embed**
      - framework: ../composeApp/build/bin/iosArm64/releaseFramework/ComposeApp.framework
        embed: false
        codeSign: false
